name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      AFVC_USE_LLM: "false"
      AFVC_AGENT_GRAPH: "true"
      AFVC_DATA_BACKEND: sql
      DATABASE_URL: postgresql://afvc:afvc@localhost:5432/afvc
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afvc
          POSTGRES_PASSWORD: afvc
          POSTGRES_DB: afvc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afvc -d afvc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Syntax
        run: python -m compileall -q backend tests scripts
      - name: Text integrity
        run: python scripts/check_text_integrity.py
      - name: Unused symbols
        run: python -m ruff check backend tests scripts
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
