name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AFVC_USE_LLM: "false"
      AFVC_AGENT_GRAPH: "true"
      AFVC_DATA_BACKEND: sql
      DATABASE_URL: postgresql://afvc:afvc@localhost:5432/afvc
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afvc
          POSTGRES_PASSWORD: afvc
          POSTGRES_DB: afvc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afvc -d afvc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Syntax
        run: python -m compileall -q backend frontend tests scripts
      - name: Text integrity
        run: python scripts/check_text_integrity.py
      - name: Unused symbols
        run: python -m ruff check backend frontend tests scripts
      - name: Tests
        run: python -m pytest -q
